name = "distributed_system_reviewer"
description = "PR이나 브랜치를 MSA 전체 구조, Kafka 이벤트, 트랜잭션, 장애 전파와 서비스 결합도 관점에서 심층 검토할 때 사용합니다. 읽기 전용 리뷰 에이전트입니다."
