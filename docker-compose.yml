services:
  # 1. MySQL
  db:
    image: mysql
    container_name: truve-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
    networks:
      - truve-network

  # 2. Redis - User
  user-redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - truve-network

  # 3. Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'ciWo7IWazngRchmPES6q5A=='
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  # 4. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: truve/api-gateway:1.0.0
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVER_URI=http://auth-server:8081
      - PAYMENT_SERVER_URI=http://payment:8082
      - QUEUE_SERVER_URI=http://queue:8083
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379
      - TICKETING_SERVER_URI=http://ticketing:8084
      - MUSICAL_SERVER_URI=http://musical:8085
    networks:
      - truve-network

  # 5. Auth Server
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-server
    image: truve/auth-server:1.0.0
    ports:
      - "8081:8081"
    environment:
      - USER_MYSQL_URL=jdbc:mysql://db:3306/user_db
      - USER_MYSQL_USERNAME=root
      - USER_MYSQL_PASSWORD=1234
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=local
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_TOKEN_URL=${KAKAO_TOKEN_URL}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI}
      - FRONT_OAUTH_CALLBACK=${FRONT_OAUTH_CALLBACK}
    depends_on:
      db:
        condition: service_healthy
      user-redis:
        condition: service_started
    networks:
      - truve-network

  # 6. Payment Server
  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment
    image: truve/payment:1.0.0
    ports:
      - "8082:8082"
    environment:
      - PAYMENT_MYSQL_URL=jdbc:mysql://db:3306/payment_db
      - PAYMENT_MYSQL_USERNAME=root
      - PAYMENT_MYSQL_PASSWORD=1234
      - SPRING_PROFILES_ACTIVE=local
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - truve-network

  # 7. Queue Server
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: queue
    image: truve/queue:1.0.0
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379

    depends_on:
      user-redis:
        condition: service_started
    networks:
      - truve-network

  # 8. Ticketing Server
  ticketing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ticketing
    image: truve/ticketing:1.0.0
    ports:
      - "8084:8084"
    environment:
      - TICKETING_MYSQL_URL=jdbc:mysql://db:3306/ticketing_db
      - TICKETING_MYSQL_USERNAME=root
      - TICKETING_MYSQL_PASSWORD=1234
      - SPRING_PROFILES_ACTIVE=local
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379

    depends_on:
      db:
        condition: service_healthy
      user-redis:
        condition: service_started
    networks:
      - truve-network

  # 9. Musical Server
  musical:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: musical
    image: truve/musical:1.0.0
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - MUSICAL_MYSQL_URL=jdbc:mysql://db:3306/musical_db
      - MUSICAL_MYSQL_USERNAME=root
      - MUSICAL_MYSQL_PASSWORD=1234
      - AWS_S3_BUCKET=truve-media
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY=test
      - AWS_SECRET_KEY=test
      - AWS_S3_ENDPOINT=http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
    networks:
      - truve-network


  # 10. LocalStack
  localstack:
    image: localstack/localstack
    container_name: truve-media-dev
    ports:
      - "4566:4566"
    volumes:
      - "./localstack:/var/lib/localstack"
      - "./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh"
    environment:
      - PERSISTENCE=1
    entrypoint: >
      /bin/sh -c "chmod +x /etc/localstack/init/ready.d/init-s3.sh && /usr/local/bin/docker-entrypoint.sh"
    networks:
      - truve-network

volumes:
  mysql-data:
  redis-data:

networks:
  truve-network:
    driver: bridge
