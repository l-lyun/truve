services:
  # 1. MySQL
  db:
    image: mysql
    container_name: truve-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
    networks:
      - truve-network

  # 2. Redis - User
  user-redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - truve-network

  # 3. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: truve/api-gateway:1.0.0
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVER_URI=http://auth-server:8081
      - PAYMENT_SERVER_URI=http://payment:8082
    networks:
      - truve-network

  # 4. Auth Server
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-server
    image: truve/auth-server:1.0.0
    ports:
      - "8081:8081"
    environment:
      - USER_MYSQL_URL=jdbc:mysql://db:3306/user_db
      - USER_MYSQL_USERNAME=root
      - USER_MYSQL_PASSWORD=1234
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=local
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - KAKAO_TOKEN_URL=${KAKAO_TOKEN_URL}
    depends_on:
      db:
        condition: service_healthy
      user-redis:
        condition: service_started
    networks:
      - truve-network

  # 5. Payment Server
  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment
    image: truve/payment:1.0.0
    ports:
      - "8082:8082"
    environment:
      - PAYMENT_MYSQL_URL=jdbc:mysql://db:3306/payment_db
      - PAYMENT_MYSQL_USERNAME=root
      - PAYMENT_MYSQL_PASSWORD=1234
      - SPRING_PROFILES_ACTIVE=local
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - truve-network

volumes:
  mysql-data:
  redis-data:

networks:
  truve-network:
    driver: bridge