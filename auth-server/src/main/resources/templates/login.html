<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>OAuth Login Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 760px;
            margin: 48px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .kakao {
            background: #fee500;
            color: #191919;
        }

        .naver {
            background: #03c75a;
            color: white;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h2>소셜 로그인 테스트 페이지</h2>

<div class="card">
    <h3>테스트 흐름</h3>
    <p>기존 회원이면 바로 로그인 완료로 이동하고, 신규 회원이면 <code>registrationToken</code>과 함께 회원가입 진행 상태로 이동합니다.</p>
    <p>콜백 페이지는 <code>/test/callback</code>에서 확인할 수 있습니다.</p>
</div>

<div class="card">
    <h3>소셜 로그인 시작</h3>
    <div class="actions">
        <a href="/api/auth/kakao/login">
            <button class="kakao" type="button">카카오 로그인</button>
        </a>
        <a href="/api/auth/naver/login">
            <button class="naver" type="button">네이버 로그인</button>
        </a>
    </div>
</div>

</body>
</html>
