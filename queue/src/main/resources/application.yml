server:
  port: ${QUEUE_SERVER_PORT:8083}

spring:
  data:
    redis:
      host: ${USER_REDIS_HOST:localhost}
      port: ${USER_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

queue:
  permit-per-tick: ${QUEUE_PERMIT_PER_TICK:100}
  scheduler-delay-ms: ${QUEUE_SCHEDULER_DELAY_MS:500}
  ready-ttl-sec: ${QUEUE_READY_TTL_SEC:120}
  scheduler-enabled: ${QUEUE_SCHEDULER_ENABLED:true}
  active-window-ms: ${TICKETING_ACTIVE_WINDOW_MS:30000}
  active-limit: ${TICKETING_ACTIVE_LIMIT:1000}

springdoc:
  api-docs:
    path: /api/queue/v3/api-docs

jwt:
  secret: ${JWT_SECRET:kt-cloud-tech-up-final-queue-2026020201010101}
