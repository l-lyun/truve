services:
  db:
    image: mysql
    container_name: truve-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
    networks:
      - truve-network

  # 2. Redis
  user-redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - truve-network

  # 3. API Gateway
  api-gateway:
    image: kye8780/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVER_URI=http://auth-server:8081
      - PAYMENT_SERVER_URI=http://payment:8082
    depends_on:
      - auth-server
      - payment
    networks:
      - truve-network

  # 4. Auth Server
  auth-server:
    image: kye8780/auth-server:latest
    ports:
      - "8081:8081"
    environment:
      - USER_MYSQL_URL=jdbc:mysql://db:3306/user_db
      - USER_MYSQL_USERNAME=root
      - USER_MYSQL_PASSWORD=1234
      - USER_REDIS_HOST=user-redis
      - USER_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      db:
        condition: service_healthy
      user-redis:
        condition: service_started
    networks:
      - truve-network

  # 5. Payment Server
  payment:
    image: kye8780/payment:latest
    ports:
      - "8082:8082"
    environment:
      - PAYMENT_MYSQL_URL=jdbc:mysql://db:3306/payment_db
      - PAYMENT_MYSQL_USERNAME=root
      - PAYMENT_MYSQL_PASSWORD=1234
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - truve-network

volumes:
  mysql-data:
  redis-data:

networks:
  truve-network:
    driver: bridge