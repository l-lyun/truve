server:
  port: 8085

spring:
  application:
    name: musical

  config:
    import: "classpath:application-observability.yml"

  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: ${MUSICAL_MYSQL_URL:jdbc:mysql://localhost:3306/musical_db}
    username: ${MUSICAL_MYSQL_USERNAME:root}
    password: ${MUSICAL_MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

s3:
  bucket: ${AWS_S3_BUCKET:-truve-dev-bucket}
  region: ${AWS_REGION:-ap-northeast-2}

springdoc:
  api-docs:
    path: /api/musical/v3/api-docs
